name: build-motor-c3

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      enable_output:
        description: "Build with physical PPM output enabled (1) — technician sign-off only. Default 0 (bench-safe)."
        required: false
        default: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32c3
          command: >-
            idf.py -DMOTOR_OUTPUT_ENABLED=${{ github.event.inputs.enable_output || '0' }}
            set-target esp32c3 build
          path: motor-c3

      - name: Assemble self-contained flasher package
        run: python3 scripts/make_package.py
        working-directory: motor-c3

      - name: Upload flasher artifact
        uses: actions/upload-artifact@v4
        with:
          name: motor-c3-flasher
          path: motor-c3/dist/motor-c3-flasher/**
          if-no-files-found: error
